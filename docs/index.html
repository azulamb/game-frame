<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>game-frame sample</title>
    <script src="./game-frame.js" defer></script>
    <script>
      customElements.whenDefined('game-frame').then(() => {
        const game = document.getElementById('game');
        const canvas = game.getCanvas();
        const context = canvas.getContext('2d');
        context.fillStyle = 'gray';
        context.fillRect(0, 0, canvas.width, canvas.height);
      });
    </script>
    <style>html, body { margin: 0; padding: 0; }html { height: 100%; }body { width: 100%; height: 100%; }</style>
  </head>
  <body>
    <game-frame id="game"></game-frame>
  </body>
</html>
